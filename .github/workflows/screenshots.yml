name: Screenshots

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture settings window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired on 2026-11-02 (actions/runner-images#13518).
        os: [macos-15, macos-26, xcode-27]
        include:
          # From Xcode 27 on, GitHub names an image after its Xcode: `xcode-27` runs macOS 27 and
          # carries only Xcode 27, which is also what an app built for macOS 27 uses.
          - os: xcode-27
            image-xcode: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .xcode-version is the one place the Xcode version is written.
      - name: Select Xcode from .xcode-version
        if: ${{ !matrix.image-xcode }}
        run: |
          xcode_version=$(tr -d '[:space:]' <.xcode-version)
          developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
          [[ -d $developer_dir ]] || { echo "::error::Xcode $xcode_version (.xcode-version) is not installed on this runner"; exit 1; }
          echo "XCODE_VERSION=$xcode_version" >>"$GITHUB_ENV"
          echo "DEVELOPER_DIR=$developer_dir" >>"$GITHUB_ENV"
          sudo DEVELOPER_DIR="$developer_dir" xcodebuild -runFirstLaunch
          sw_vers
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - name: Use the image's Xcode
        if: ${{ matrix.image-xcode }}
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >>"$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          swift --version
      # The runner image turns both on; a Mac has them off. With Reduce Transparency on, macOS 26
      # and 27 draw no glass, and their System Settings shows a line under the toolbar at rest.
      - name: Turn off Reduce Transparency and Reduce Motion
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          sleep 1
          reduced=$(osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSWorkspace.sharedWorkspace.accessibilityDisplayShouldReduceTransparency')
          [[ $reduced == false ]] || { echo "::error::Reduce Transparency is still on"; exit 1; }
      # The runner image sets a solid black wallpaper. Windows take a tint from the wallpaper
      # behind them, so over black the sidebar and the page came out a flat, darker gray than on
      # a Mac. DefaultDesktop.heic links to the default wallpaper of the macOS that runs.
      - name: Set the default wallpaper
        run: |
          wallpaper=/System/Library/CoreServices/DefaultDesktop.heic
          [[ -e $wallpaper ]] || { echo "::error::$wallpaper is missing"; exit 1; }
          readlink "$wallpaper"
          osascript -e "tell application \"Finder\" to set desktop picture to POSIX file \"$wallpaper\""
          sleep 2
      - run: scripts/screenshots.sh screenshots
      # Upload even on failure so a partially captured matrix can be inspected.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
