name: Screenshots

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture settings window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired on 2026-11-02 (actions/runner-images#13518).
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .xcode-version is the one place the Xcode version is written.
      - name: Select Xcode from .xcode-version
        run: |
          xcode_version=$(tr -d '[:space:]' <.xcode-version)
          developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
          [[ -d $developer_dir ]] || { echo "::error::Xcode $xcode_version (.xcode-version) is not installed on this runner"; exit 1; }
          echo "XCODE_VERSION=$xcode_version" >>"$GITHUB_ENV"
          echo "DEVELOPER_DIR=$developer_dir" >>"$GITHUB_ENV"
          sudo DEVELOPER_DIR="$developer_dir" xcodebuild -runFirstLaunch
          sw_vers
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - run: scripts/screenshots.sh screenshots
      # Upload even on failure so a partially captured matrix can be inspected.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
